name: TV sport obavestenja

on:
  schedule:
    - cron: "*/15 4-22 * * *"
  workflow_dispatch:
    inputs:
      refresh:
        description: "Ponovo preuzmi raspored (ignorisi kes)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tv-notifier
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Proveri raspored i posalji obavestenja
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ "${{ inputs.refresh }}" = "true" ]; then
            python tv_notifier.py --refresh
          else
            python tv_notifier.py
          fi

      - name: Sacuvaj stanje
        if: always()
        run: |
          if [ -n "$(git status --porcelain state)" ]; then
            git config user.name "tv-notifier"
            git config user.email "tv-notifier@users.noreply.github.com"
            git add state
            git commit -m "Stanje $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push
          fi
